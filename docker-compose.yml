version: "3.9"

# Docker-ийн json-file driver хэмжээ хязгааргүй лог хуримтлуулж диск дүүрэх
# шалтгаан болдог тул rotation тохируулна.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_API_URL: ${NEXT_API_URL}
        NEXT_GS_URL: ${NEXT_GS_URL}
        NEXT_PUBLIC_CESIUM_ION_TOKEN: ${NEXT_PUBLIC_CESIUM_ION_TOKEN}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      TZ: Asia/Ulaanbaatar
      NODE_ENV: production
      NEXT_API_URL: ${NEXT_API_URL}
      NEXT_GS_URL: ${NEXT_GS_URL}
      # Файлын систем — /api/files proxy ЭНЭ хаягаар MinIO-с файл тараана
      # (баримт, зураг, тайлан, дроны ортофото). Заагаагүй бол код нь
      # localhost:9000 гэж үзэх ба container дотор тэнд юу ч байхгүй тул
      # БҮХ файл татах линк эвдэрнэ. Build arg биш — server-side route тул
      # runtime env хүрэлцэнэ.
      NEXT_S3_ENDPOINT: ${NEXT_S3_ENDPOINT:-http://minio:9000}
      NEXT_S3_BUCKET: ${NEXT_S3_BUCKET:-gov-files}
    restart: on-failure
    logging: *default-logging
    networks:
      - gov_network

networks:
  gov_network:
    name: gov_network
    external: true
